[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docqa-failure-analysis"
version = "0.1.0"
description = "Counterfactual error attribution for multilingual document QA (research harness)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "sidg2hp" }]
keywords = ["document-qa", "ocr", "vlm", "multilingual", "error-analysis"]
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.3",
  "PyYAML>=6.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "requests>=2.31",
]

[project.optional-dependencies]
data = ["datasets>=2.20"]
gpu = [
  "torch>=2.2",
  "transformers>=4.45",
  "accelerate>=0.33",
  "bitsandbytes>=0.43.3",
  "qwen-vl-utils>=0.0.8",
]
ocr = ["pytesseract>=0.3.10", "paddleocr>=2.8"]
plot = ["matplotlib>=3.9"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/sidg2hp/Multilingual-document-QA-failure-analysis"

[tool.setuptools.packages.find]
include = ["src*", "scripts*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src"]
